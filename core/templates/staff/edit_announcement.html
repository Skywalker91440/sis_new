{% extends 'base_staff_dashboard.html' %}

{% block title %}Edit Announcement{% endblock %}

{% block staff_content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning">
                <h5><i class="fas fa-edit"></i> Edit Announcement</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <label><i class="fas fa-tag"></i> Announcement Type</label>
                        <select name="announcement_type" class="form-control" required>
                            <option value="general" {% if announcement.announcement_type == 'general' %}selected{% endif %}>📢 General</option>
                            <option value="exam" {% if announcement.announcement_type == 'exam' %}selected{% endif %}>📝 Exam</option>
                            <option value="assignment" {% if announcement.announcement_type == 'assignment' %}selected{% endif %}>📚 Assignment</option>
                            <option value="class" {% if announcement.announcement_type == 'class' %}selected{% endif %}>🏫 Class</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label><i class="fas fa-heading"></i> Title</label>
                        <input type="text" name="title" class="form-control" value="{{ announcement.title }}" required>
                    </div>
                    <div class="form-group mb-3">
                        <label><i class="fas fa-align-left"></i> Content</label>
                        <textarea name="content" class="form-control" rows="8" required>{{ announcement.content }}</textarea>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn-update">
                            <i class="fas fa-save"></i> Update Announcement
                        </button>
                        <a href="{% url 'staff_announcements' %}" class="btn-back">
                            <i class="fas fa-arrow-left"></i> Back to Announcements
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    
    .card-header {
        background: linear-gradient(135deg, #033f52 0%, #33a8bd 100%);
        padding: 15px 20px;
    }
    
    .card-header h5 {
        margin: 0;
        color: white;
    }
    
    .card-body {
        padding: 25px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2c3e50;
        font-size: 13px;
    }
    
    .form-group label i {
        margin-right: 8px;
        color: #f39c12;
    }
    
    .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        transition: all 0.3s;
    }
    
    .form-control:focus {
        border-color: #f39c12;
        outline: none;
        box-shadow: 0 0 0 3px rgba(243,156,18,0.1);
    }
    
    textarea.form-control {
        resize: vertical;
    }
    
    .btn-update {
        display: inline-block;
        padding: 10px 25px;
        background: linear-gradient(135deg, #0ba4ca 0%, #21beda 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 500;
        margin-right: 10px;
    }
    
    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(243,156,18,0.3);
    }
    
    .btn-back {
        display: inline-block;
        padding: 10px 20px;
        background: #95a5a6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.3s;
    }
    
    .btn-back:hover {
        background: #7f8c8d;
        transform: translateY(-2px);
        color: white;
    }
    
    @media (max-width: 600px) {
        .card-body {
            padding: 20px;
        }
        .btn-update, .btn-back {
            display: block;
            width: 100%;
            margin: 10px 0;
            text-align: center;
        }
    }
</style>
{% endblock %}
