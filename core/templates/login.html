{% extends 'base_auth.html' %}
{% load static %}

{% block title %}Student Login{% endblock %}

{% block content %}
<style>
    body {
        background: url("{% static 'images/image3.jpg' %}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }
    
    .login-card {
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        padding: 45px 40px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        max-width: 450px;
        margin: 0 auto;
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 35px;
    }
    
    .login-icon {
        font-size: 60px;
        margin-bottom: 15px;
    }
    
    .login-header h2 {
        color: #2c3e50;
        font-size: 28px;
        margin-bottom: 8px;
    }
    
    .login-header p {
        color: #7f8c8d;
        font-size: 14px;
    }
    
    .input-group {
        margin-bottom: 25px;
    }
    
    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #2c3e50;
        font-weight: 500;
        font-size: 14px;
    }
    
    .input-field {
        display: flex;
        align-items: center;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        transition: all 0.3s;
        background: white;
    }
    
    .input-field:focus-within {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    .field-icon {
        padding: 0 12px;
        font-size: 18px;
        color: #7f8c8d;
    }
    
    .input-field input {
        flex: 1;
        padding: 14px 12px 14px 0;
        border: none;
        outline: none;
        font-size: 14px;
        background: transparent;
        width: 100%;
    }
    
    .checkbox-group {
        margin: 15px 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .checkbox-group input {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }
    
    .checkbox-group label {
        margin: 0;
        cursor: pointer;
        color: #7f8c8d;
        font-size: 14px;
    }
    
    .checkbox-group label:hover {
        color: #667eea;
    }
    
    .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102,126,234,0.4);
    }
    
    .forgot-link {
        text-align: right;
        margin-top: 10px;
        margin-bottom: 20px;
    }
    
    .forgot-link a {
        color: #667eea;
        text-decoration: none;
        font-size: 13px;
    }
    
    .forgot-link a:hover {
        text-decoration: underline;
    }
    
    .signup-redirect {
        text-align: center;
        margin: 25px 0 20px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        color: #7f8c8d;
        font-size: 14px;
    }
    
    .signup-redirect a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        margin-left: 8px;
    }
    
    .back-home {
        text-align: center;
    }
    
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #95a5a6;
        text-decoration: none;
        font-size: 13px;
    }
    
    @media (max-width: 500px) {
        .login-card {
            padding: 30px 25px;
        }
    }
</style>

<div class="login-card">
    <div class="login-header">
        <div class="login-icon"></div>
        <h2>Login</h2>
        <p>Please login using your credentials</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="input-group">
            <label>Username / Student ID</label>
            <div class="input-field">
                <span class="field-icon"></span>
                <input type="text" name="username" placeholder="Enter your username or student ID" required>
            </div>
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <div class="input-field">
                <span class="field-icon"></span>
                <input type="password" name="password" id="password" placeholder="Enter your password" required>
            </div>
        </div>
        
        <!-- Show Password Checkbox -->
        <div class="checkbox-group">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Password</label>
        </div>
        
        <button type="submit" class="login-btn">Login</button>
    </form>
    
    <div class="forgot-link">
        <a href="/forgot-password/">Forgot Password?</a>
    </div>
    
    <div class="signup-redirect">
        <span>Don't have an account?</span>
        <a href="/register/">Register here</a>
    </div>
    
    <div class="back-home">
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    // Show/Hide Password functionality
    const showPasswordCheckbox = document.getElementById('showPassword');
    const passwordField = document.getElementById('password');
    
    if (showPasswordCheckbox && passwordField) {
        showPasswordCheckbox.addEventListener('change', function() {
            if (this.checked) {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        });
    }
</script>
{% endblock %}
