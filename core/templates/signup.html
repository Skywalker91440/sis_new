{% extends 'base_auth.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="card">
    <div class="signup-header">
        <div class="signup-icon"></div>
        <h2>Student Registration</h2>
        <p>Create your account to get started</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            {{ form.email }}
        </div>
        
        <div class="form-group">
            <label>Password</label>
            {{ form.password1 }}
        </div>
        
        <div class="form-group">
            <label>✓ Confirm Password</label>
            {{ form.password2 }}
        </div>
        
        <button type="submit" class="register-btn">Register Account</button>
    </form>
    
    <div class="login-link">
        Already have an account? <a href="/login/">Login here</a>
    </div>
</div>

<style>
    .card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        max-width: 450px;
        margin: 0 auto;
    }
    
    .signup-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .signup-icon {
        font-size: 50px;
        margin-bottom: 10px;
    }
    
    .signup-header h2 {
        color: #2c3e50;
        margin-bottom: 5px;
        font-size: 24px;
    }
    
    .signup-header p {
        color: #7f8c8d;
        font-size: 14px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #2c3e50;
        font-weight: 500;
        font-size: 14px;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s;
        box-sizing: border-box;
    }
    
    .form-group input:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    .register-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }
    
    .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
    
    .login-link {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        color: #7f8c8d;
        font-size: 14px;
    }
    
    .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
    }
    
    .login-link a:hover {
        text-decoration: underline;
    }
    
    /* Error messages */
    .errorlist {
        color: #e74c3c;
        font-size: 12px;
        list-style: none;
        margin-top: 5px;
        padding-left: 0;
    }
    
    .alert {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
    }
    
    .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
</style>
{% endblock %}
