<!DOCTYPE html>
<html>
<head>
    <title>Submit Assignment</title>
</head>
<body>
    <h1>Submit Assignment: {{ assignment.title }}</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="submission_file">Choose file:</label>
        <input type="file" name="submission_file" id="submission_file" required>
        <br><br>
        <button type="submit">Submit Assignment</button>
    </form>
    
    <br>
    <a href="{% url 'assignment_detail' assignment.id %}">Back to Assignment</a>
</body>
</html>
