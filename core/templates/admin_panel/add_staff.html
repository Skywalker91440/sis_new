{% extends 'admin_panel/base_admin.html' %}

{% block page_title %}Add New Staff{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header bg-success text-white">
        <h5><i class="fas fa-user-plus"></i> Add New Staff Member</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Username *</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter username">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email *</label>
                    <input type="email" name="email" class="form-control" required placeholder="staff@example.com">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="First name">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Last name">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="Phone number">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Department</label>
                    <select name="department" class="form-control">
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Business">Business</option>
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Position</label>
                    <select name="position" class="form-control">
                        <option value="Senior Lecturer">Senior Lecturer</option>
                        <option value="Lecturer">Lecturer</option>
                        <option value="Assistant Lecturer">Assistant Lecturer</option>
                        <option value="Professor">Professor</option>
                        <option value="Associate Professor">Associate Professor</option>
                        <option value="Teacher">Teacher</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Password</label>
                    <input type="text" name="password" class="form-control" value="staff123" required>
                    <small class="text-muted">Default: staff123</small>
                </div>
            </div>
            
            <div class="alert alert-info mt-2">
                <i class="fas fa-info-circle"></i> Staff ID will be generated automatically: <strong>STF2026xxxxx</strong>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Add Staff
                </button>
                <a href="{% url 'admin_staff' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

<script>
function validatePhoneNumber(phone) {
    if (!phone) return true;
    const cleanPhone = phone.replace(/[\s\-\(\)]/g, '');
    const phoneRegex = /^\+?[0-9]{10,15}$/;
    return phoneRegex.test(cleanPhone);
}

const phoneInput = document.querySelector('input[name="phone"]');
if (phoneInput) {
    phoneInput.addEventListener('input', function() {
        if (this.value && !validatePhoneNumber(this.value)) {
            this.style.borderColor = '#e74c3c';
        } else {
            this.style.borderColor = '#e0e0e0';
        }
    });
}

document.querySelector('form').addEventListener('submit', function(e) {
    const phone = phoneInput.value;
    if (phone && !validatePhoneNumber(phone)) {
        e.preventDefault();
        alert('Please enter a valid phone number (10-15 digits, e.g., 0712345678 or +255712345678)');
        return false;
    }
});
</script>
