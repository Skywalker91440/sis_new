<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .navbar { background: #2c3e50; padding: 15px 20px; color: white; }
        .navbar a { color: white; text-decoration: none; margin: 0 15px; }
        .container { padding: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="navbar">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong>SIS Tanzania</strong>
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'my_subjects' %}">My Subjects</a>
                <a href="{% url 'my_attendance' %}">Attendance</a>
                <a href="{% url 'my_marks' %}">Marks</a>
                <a href="{% url 'my_fee' %}">Fees</a>
            </div>
            <div>
                <span>Welcome, {{ user.username }}</span>
                <a href="{% url 'profile_view' %}">Profile</a>
                <a href="{% url 'login' %}">Logout</a>
            </div>
        </div>
    </div>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
